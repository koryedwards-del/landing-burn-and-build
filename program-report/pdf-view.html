<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Print Shop PDF</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Open Sans", system-ui, sans-serif;
      background: #121212;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .pdf-toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
    }
    .pdf-toolbar__title {
      font-family: Oswald, system-ui, sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--logo-burn, #fdc500);
    }
    .pdf-toolbar__lead {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }
    .pdf-toolbar__status {
      font-size: 0.84rem;
      line-height: 1.45;
      color: #ccc;
    }
    .pdf-toolbar__status strong { color: #fff; }
    .pdf-toolbar__status--error { color: #ff8a80; }
    .pdf-toolbar__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .pdf-toolbar__btn {
      appearance: none;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 10px 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .pdf-toolbar__btn:hover { border-color: var(--logo-burn, #fdc500); }
    .pdf-toolbar__btn--primary {
      background: var(--logo-burn, #fdc500);
      border-color: var(--logo-burn, #fdc500);
      color: #111;
    }
    .pdf-frame {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: 0;
      background: #525659;
    }
  </style>
</head>
<body>
  <div class="pdf-toolbar">
    <p class="pdf-toolbar__title" id="pdf-title">Print Shop</p>
    <p class="pdf-toolbar__lead">Print or save this document</p>
    <p class="pdf-toolbar__status" id="pdf-status">Loading PDF…</p>
    <div class="pdf-toolbar__actions">
      <button type="button" class="pdf-toolbar__btn pdf-toolbar__btn--primary" id="pdf-print" disabled>Print again</button>
      <a class="pdf-toolbar__btn" id="pdf-download" download hidden>Download PDF</a>
    </div>
  </div>
  <iframe class="pdf-frame" id="pdf-frame" title="PDF document"></iframe>
  <script type="module">
    import { apiUrl } from '../js/apiConfig.js';

    const VIEW_TITLES = {
      faq: 'Frequently Asked Questions',
      foodlist: 'Food List',
      bestresults: 'For Best Results',
      week: 'Weekly Meal Plan',
      shopping: 'Grocery List',
    };

    const view = new URLSearchParams(window.location.search).get('view') || 'faq';
    const title = VIEW_TITLES[view] || 'Document';
    document.getElementById('pdf-title').textContent = title;
    document.title = `B&B — ${title}`;

    const statusEl = document.getElementById('pdf-status');
    const frame = document.getElementById('pdf-frame');
    const printBtn = document.getElementById('pdf-print');
    const downloadLink = document.getElementById('pdf-download');

    function triggerPrint() {
      try {
        frame.contentWindow?.focus();
        frame.contentWindow?.print();
      } catch (_) {
        window.print();
      }
    }

    printBtn.addEventListener('click', triggerPrint);

    frame.addEventListener('load', () => {
      printBtn.disabled = false;
      statusEl.innerHTML = 'The <strong>print dialog</strong> should open automatically. Choose your printer, or pick <strong>Save as PDF</strong> to keep a copy. You can also use <strong>Download PDF</strong> below.';
      triggerPrint();
    });

    try {
      const res = await fetch(apiUrl(`/api/print/pdf?view=${encodeURIComponent(view)}`));
      if (!res.ok) {
        let message = 'Could not generate PDF.';
        try {
          const body = await res.json();
          if (body?.message) message = body.message;
        } catch (_) { /* ignore */ }
        statusEl.textContent = message;
        statusEl.classList.add('pdf-toolbar__status--error');
        throw new Error(message);
      }

      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      frame.src = blobUrl;
      downloadLink.href = blobUrl;
      downloadLink.download = `burn-and-build-${view}.pdf`;
      downloadLink.hidden = false;
    } catch (err) {
      if (!statusEl.classList.contains('pdf-toolbar__status--error')) {
        statusEl.textContent = err.message || 'Could not load PDF.';
        statusEl.classList.add('pdf-toolbar__status--error');
      }
    }
  </script>
</body>
</html>
